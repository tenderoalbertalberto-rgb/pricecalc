<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5B21B6">
<title>PriceCalc Pro - Fija el precio perfecto</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { font-family: system-ui, sans-serif; box-sizing: border-box; }
  body { background: #0f0720; color: #fff; margin: 0; }
  .gradient-bg { background: linear-gradient(135deg, #1e1b4b 0%, #5B21B6 50%, #7C3AED 100%); }
  .gradient-gold { background: linear-gradient(135deg, #F59E0B 0%, #FCD34D 100%); }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
  .glass-gold { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); }
  .tab-active { background: linear-gradient(135deg, #F59E0B, #FCD34D); color: #1e1b4b; font-weight: 700; }
  .tab-inactive { background: rgba(255,255,255,0.05); color: #a78bfa; }
  .btn-primary { background: linear-gradient(135deg, #F59E0B, #FCD34D); color: #1e1b4b; font-weight: 700; border: none; cursor: pointer; padding: 1rem; border-radius: 0.75rem; width: 100%; font-size: 1.125rem; }
  .btn-secondary { background: linear-gradient(135deg, #7C3AED, #5B21B6); color: #fff; font-weight: 600; border: none; cursor: pointer; padding: 0.5rem 1rem; border-radius: 0.5rem; }
  .input-field { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; }
  .input-field:focus { border-color: #F59E0B; outline: none; }
  .result-card { background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(124,58,237,0.1)); border: 1px solid rgba(245,158,11,0.3); border-radius: 1rem; padding: 2rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="fixed top-0 left-0 right-0 z-40 glass border-b border-purple-500/20">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center font-black text-xl text-amber-400">P</div>
      <div>
        <h1 class="font-bold text-lg">PriceCalc <span class="text-amber-400">Pro</span></h1>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div id="licenseStatus" class="hidden items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold glass-gold">
        <i class="fas fa-crown text-amber-400"></i>
        <span id="licenseText">Modo Free</span>
      </div>
      <button onclick="openLicenseModal()" class="btn-secondary">
        <i class="fas fa-key mr-1"></i>Activar
      </button>
    </div>
  </div>
</header>

<section class="pt-24 pb-16 px-4">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-black mb-4">Calculadora <span class="text-amber-400">especializada</span></h2>
    </div>
    
    <div class="flex flex-wrap gap-2 mb-8 justify-center">
      <button onclick="switchCalc('curso')" id="tab-curso" class="tab-active px-5 py-3 rounded-xl text-sm">Curso</button>
      <button onclick="switchCalc('ebook')" id="tab-ebook" class="tab-inactive px-5 py-3 rounded-xl text-sm">Ebook</button>
      <button onclick="switchCalc('membresia')" id="tab-membresia" class="tab-inactive px-5 py-3 rounded-xl text-sm">Membresía</button>
      <button onclick="switchCalc('coaching')" id="tab-coaching" class="tab-inactive px-5 py-3 rounded-xl text-sm">Coaching</button>
      <button onclick="switchCalc('webinar')" id="tab-webinar" class="tab-inactive px-5 py-3 rounded-xl text-sm">Webinar</button>
    </div>

    <div class="grid lg:grid-cols-2 gap-8">
      <div class="glass rounded-2xl p-8">
        <h3 id="calcTitle" class="text-2xl font-bold mb-6"><i class="fas fa-play text-amber-400 mr-2"></i>Curso Online</h3>
        <div id="calcForm" class="space-y-4"></div>
        <button onclick="calculatePrice()" class="btn-primary mt-6">
          <i class="fas fa-rocket mr-2"></i>Calcular precio óptimo
        </button>
      </div>

      <div>
        <div id="resultCard" class="result-card hidden">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold">Precio recomendado</h3>
            <span class="px-3 py-1 rounded-full bg-amber-400/20 text-amber-400 text-xs font-bold">ÓPTIMO</span>
          </div>
          <div class="text-5xl font-black text-amber-400 mb-2" id="resultPrice">$0</div>
          <p class="text-purple-300 text-sm mb-6" id="resultSubtitle">Precio sugerido</p>
          
          <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="glass rounded-xl p-4">
              <div class="text-xs text-purple-300 mb-1">Rango mínimo</div>
              <div class="text-xl font-bold" id="resultMin">$0</div>
            </div>
            <div class="glass rounded-xl p-4">
              <div class="text-xs text-purple-300 mb-1">Rango máximo</div>
              <div class="text-xl font-bold text-amber-400" id="resultMax">$0</div>
            </div>
            <div class="glass rounded-xl p-4">
              <div class="text-xs text-purple-300 mb-1">Margen neto</div>
              <div class="text-xl font-bold text-green-400" id="resultMargin">0%</div>
            </div>
            <div class="glass rounded-xl p-4">
              <div class="text-xs text-purple-300 mb-1">Punto de equilibrio</div>
              <div class="text-xl font-bold" id="resultBreakeven">0 ventas</div>
            </div>
          </div>
          <div class="glass rounded-xl p-4">
            <div class="text-xs text-purple-300 mb-2">💡 Recomendación</div>
            <p class="text-sm" id="resultAdvice">-</p>
          </div>
        </div>

        <div id="emptyResult" class="glass rounded-2xl p-8 text-center">
          <i class="fas fa-chart-pie text-6xl text-purple-500/30 mb-4"></i>
          <p class="text-purple-300">Completa los datos y haz clic en calcular</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="licenseModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background: rgba(0,0,0,0.8);">
  <div class="glass rounded-2xl p-8 max-w-md w-full relative">
    <button onclick="closeLicenseModal()" class="absolute top-4 right-4 text-purple-300"><i class="fas fa-times text-xl"></i></button>
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto rounded-2xl gradient-gold flex items-center justify-center mb-4">
        <i class="fas fa-key text-3xl text-purple-900"></i>
      </div>
      <h3 class="text-2xl font-bold mb-2">Activar licencia PRO</h3>
    </div>
    <input type="text" id="licenseInput" placeholder="XXXX-XXXX-XXXX" class="input-field w-full px-4 py-4 rounded-xl text-center text-lg font-mono uppercase mb-4">
    <div id="licenseError" class="hidden text-red-400 text-sm mb-4 text-center"></div>
    <button onclick="validateLicense()" class="btn-primary">
      <i class="fas fa-unlock mr-2"></i>Activar PRO
    </button>
  </div>
</div>

<script>
const LICENSE_SERVER_URL = 'https://raw.githubusercontent.com/tenderoalbertalberto-rgb/pricecalc/main/licenses.json';
let isPremium = localStorage.getItem('pricecalc_premium') === 'true';
let currentCalc = 'curso';

const calcConfigs = {
  curso: {
    title: 'Curso Online', icon: 'fa-play',
    fields: [
      { id: 'fixedCost', label: 'Costos fijos ($)', value: 2000 },
      { id: 'varCost', label: 'Costo variable por alumno ($)', value: 10 },
      { id: 'targetSales', label: 'Ventas objetivo mensuales', value: 50 },
      { id: 'margin', label: 'Margen deseado (%)', value: 70 },
      { id: 'value', label: 'Valor que aporta al alumno ($/año)', value: 5000 },
      { id: 'capture', label: '% del valor que capturas', value: 10 }
    ]
  },
  ebook: {
    title: 'Ebook', icon: 'fa-book',
    fields: [
      { id: 'fixedCost', label: 'Costos de creación ($)', value: 500 },
      { id: 'varCost', label: 'Costo por descarga ($)', value: 0 },
      { id: 'targetSales', label: 'Ventas objetivo mensuales', value: 200 },
      { id: 'margin', label: 'Margen deseado (%)', value: 90 },
      { id: 'pages', label: 'Número de páginas', value: 150 },
      { id: 'niche', label: 'Competencia (1=baja, 10=alta)', value: 6 }
    ]
  },
  membresia: {
    title: 'Membresía', icon: 'fa-crown',
    fields: [
      { id: 'fixedCost', label: 'Costos fijos mensuales ($)', value: 1500 },
      { id: 'varCost', label: 'Costo por miembro/mes ($)', value: 5 },
      { id: 'targetSales', label: 'Miembros objetivo', value: 100 },
      { id: 'margin', label: 'Margen deseado (%)', value: 60 },
      { id: 'churn', label: 'Churn rate mensual (%)', value: 8 },
      { id: 'ltv', label: 'LTV esperado por miembro ($)', value: 500 }
    ]
  },
  coaching: {
    title: 'Coaching 1:1', icon: 'fa-users',
    fields: [
      { id: 'fixedCost', label: 'Costos fijos mensuales ($)', value: 800 },
      { id: 'varCost', label: 'Costo por sesión ($)', value: 20 },
      { id: 'targetSales', label: 'Clientes objetivo', value: 10 },
      { id: 'margin', label: 'Margen deseado (%)', value: 75 },
      { id: 'hours', label: 'Horas disponibles/semana', value: 20 },
      { id: 'experience', label: 'Años de experiencia', value: 5 }
    ]
  },
  webinar: {
    title: 'Webinar', icon: 'fa-microphone',
    fields: [
      { id: 'fixedCost', label: 'Costos de producción ($)', value: 300 },
      { id: 'varCost', label: 'Costo por asistente ($)', value: 2 },
      { id: 'targetSales', label: 'Asistentes objetivo', value: 500 },
      { id: 'margin', label: 'Margen deseado (%)', value: 80 },
      { id: 'conversion', label: 'Tasa de conversión esperada (%)', value: 15 },
      { id: 'upsell', label: 'Valor del upsell posterior ($)', value: 500 }
    ]
  }
};

function switchCalc(type) {
  currentCalc = type;
  Object.keys(calcConfigs).forEach(key => {
    const tab = document.getElementById(`tab-${key}`);
    if (key === type) {
      tab.className = 'tab-active px-5 py-3 rounded-xl text-sm';
    } else {
      tab.className = 'tab-inactive px-5 py-3 rounded-xl text-sm';
    }
  });
  
  const config = calcConfigs[type];
  document.getElementById('calcTitle').innerHTML = `<i class="fas ${config.icon} text-amber-400 mr-2"></i>${config.title}`;
  
  const form = document.getElementById('calcForm');
  form.innerHTML = config.fields.map(f => `
    <div>
      <label class="text-sm text-purple-300 mb-2 block">${f.label}</label>
      <input type="number" id="field-${f.id}" value="${f.value}" class="input-field">
    </div>
  `).join('');
  
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('emptyResult').classList.remove('hidden');
}

function calculatePrice() {
  const config = calcConfigs[currentCalc];
  const values = {};
  
  config.fields.forEach(f => {
    const el = document.getElementById(`field-${f.id}`);
    values[f.id] = parseFloat(el.value) || 0;
  });
  
  let price = 0, minPrice = 0, maxPrice = 0, margin = 0, breakeven = 0, advice = '';
  
  switch(currentCalc) {
    case 'curso': {
      const costPerStudent = (values.fixedCost / values.targetSales) + values.varCost;
      price = costPerStudent / (1 - values.margin/100);
      const valuePrice = values.value * (values.capture/100);
      price = Math.min(price, valuePrice);
      minPrice = price * 0.8;
      maxPrice = price * 1.3;
      margin = values.margin;
      breakeven = Math.ceil(values.fixedCost / Math.max(1, price - values.varCost));
      advice = `Con un valor percibido de $${values.value}, puedes posicionarte entre $${minPrice.toFixed(0)} y $${maxPrice.toFixed(0)}. El punto óptimo es $${price.toFixed(0)}.`;
      break;
    }
    case 'ebook': {
      const basePrice = (values.pages * 0.15) * (1 + values.niche/20);
      price = basePrice * (1 + values.margin/100);
      minPrice = price * 0.7;
      maxPrice = price * 1.4;
      margin = values.margin;
      breakeven = Math.ceil(values.fixedCost / Math.max(1, price));
      advice = `Ebooks de ${values.pages} páginas en nichos de competencia ${values.niche}/10 suelen venderse entre $${minPrice.toFixed(0)} y $${maxPrice.toFixed(0)}. Precio sugerido: $${price.toFixed(0)}.`;
      break;
    }
    case 'membresia': {
      const monthlyCost = (values.fixedCost / values.targetSales) + values.varCost;
      const ltvFactor = 1 / (values.churn/100);
      price = (values.ltv / ltvFactor) * (1 + values.margin/100);
      price = Math.max(price, monthlyCost / (1 - values.margin/100));
      minPrice = price * 0.85;
      maxPrice = price * 1.25;
      margin = values.margin;
      breakeven = Math.ceil(values.fixedCost / Math.max(1, price - values.varCost));
      advice = `Con churn del ${values.churn}%, el LTV es $${values.ltv}. Precio mensual óptimo: $${price.toFixed(0)}.`;
      break;
    }
    case 'coaching': {
      const hourlyRate = (values.experience * 50) + 100;
      const costPerClient = (values.fixedCost / values.targetSales) + values.varCost;
      price = Math.max(hourlyRate * 4, costPerClient / (1 - values.margin/100));
      minPrice = price * 0.8;
      maxPrice = price * 1.5;
      margin = values.margin;
      breakeven = Math.ceil(values.fixedCost / Math.max(1, price - values.varCost));
      advice = `Con ${values.experience} años de experiencia, tu tarifa horaria base es $${hourlyRate}. Paquete mensual sugerido: $${price.toFixed(0)}.`;
      break;
    }
    case 'webinar': {
      const costPerAttendee = (values.fixedCost / values.targetSales) + values.varCost;
      const expectedSales = values.targetSales * (values.conversion/100);
      const revenuePerAttendee = values.upsell * (values.conversion/100);
      price = Math.max(revenuePerAttendee * 0.3, costPerAttendee / (1 - values.margin/100));
      minPrice = price * 0.5;
      maxPrice = price * 2;
      margin = values.margin;
      breakeven = Math.ceil(values.fixedCost / Math.max(1, price * values.conversion/100 - values.varCost));
      advice = `Con ${values.targetSales} asistentes y ${values.conversion}% de conversión, genera ~$${(expectedSales * values.upsell).toFixed(0)} en upsells.`;
      break;
    }
  }
  
  document.getElementById('resultPrice').textContent = `$${price.toFixed(0)}`;
  document.getElementById('resultMin').textContent = `$${minPrice.toFixed(0)}`;
  document.getElementById('resultMax').textContent = `$${maxPrice.toFixed(0)}`;
  document.getElementById('resultMargin').textContent = `${margin.toFixed(0)}%`;
  document.getElementById('resultBreakeven').textContent = `${breakeven} ventas`;
  document.getElementById('resultAdvice').textContent = advice;
  document.getElementById('resultSubtitle').textContent = `Precio sugerido para ${config.title}`;
  
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('emptyResult').classList.add('hidden');
}

function updateLicenseUI() {
  const status = document.getElementById('licenseStatus');
  const text = document.getElementById('licenseText');
  
  if (isPremium) {
    status.classList.remove('hidden');
    status.classList.add('flex');
    text.innerHTML = '<i class="fas fa-crown text-amber-400 mr-1"></i> PRO Activo';
  } else {
    text.textContent = 'Modo Free';
  }
}

function openLicenseModal() {
  document.getElementById('licenseModal').classList.remove('hidden');
  document.getElementById('licenseModal').classList.add('flex');
}

function closeLicenseModal() {
  document.getElementById('licenseModal').classList.add('hidden');
  document.getElementById('licenseModal').classList.remove('flex');
  document.getElementById('licenseError').classList.add('hidden');
}

async function validateLicense() {
  const input = document.getElementById('licenseInput').value.trim().toUpperCase();
  const errorEl = document.getElementById('licenseError');
  
  if (!input) {
    errorEl.textContent = 'Por favor ingresa un código';
    errorEl.classList.remove('hidden');
    return;
  }
  
  try {
    const response = await fetch(LICENSE_SERVER_URL + '?t=' + Date.now());
    const data = await response.json();
    
    if (data.valid_licenses && data.valid_licenses.includes(input)) {
      isPremium = true;
      localStorage.setItem('pricecalc_premium', 'true');
      localStorage.setItem('pricecalc_license', input);
      updateLicenseUI();
      closeLicenseModal();
      alert('¡Licencia PRO activada correctamente!');
    } else {
      errorEl.textContent = 'Código inválido. Revisa tu email de Hotmart.';
      errorEl.classList.remove('hidden');
    }
  } catch (err) {
    errorEl.textContent = 'Error de conexión. Verifica tu internet.';
    errorEl.classList.remove('hidden');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  updateLicenseUI();
  switchCalc('curso');
});
</script>
</body>
</html>
